baseURL = 'http://cruftex.net'
languageCode = 'en-us'
title = 'cruftex.net'
theme = 'terminal'
uglyURLs = true

# Pagination configuration
[pagination]
  pagerSize = 10

# Site parameters
[params]
  description = "Personal blog of Jens Wilke"
  author = "Jens Wilke"
  github = "https://github.com/cruftex"
  featured_image = "/image/cruftex-logo.png"

# Permalinks configuration
[permalinks]
  posts = '/:year/:month/:day/:title'

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    lineNos = false
    style = 'github'
    noClasses = false

# Menu configuration
[menu]
  [[menu.main]]
    name = 'About'
    url = '/about.html'
    weight = 10
  [[menu.main]]
    name = 'Posts'
    url = '/posts.html'
    weight = 20
  [[menu.main]]
    name = 'Tags'
    url = '/tags.html'
    weight = 30

# RSS/Atom feed
[outputs]
  home = ['HTML', 'RSS']
  
[outputFormats]
  [outputFormats.RSS]
    mediatype = 'application/rss+xml'
    baseName = 'atom'
